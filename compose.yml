services:
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/empty.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/timberhub.conf:/etc/nginx/conf.d/jettax.conf
      - ./:/app
      - ./docker/nginx/logs:/var/log/timberhub
    container_name: timberhub_nginx
    links:
      - php
  php:
    build: docker/php
    container_name: timberhub_php
    expose:
      - 8000
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
